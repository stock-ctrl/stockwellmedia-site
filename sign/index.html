<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Agreement · Stockwell Media Co</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://souugetwznrxjtlasdtb.supabase.co; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#1b3221"/>
<link rel="icon" href="../assets/logos/favicon.svg"/>
<link rel="stylesheet" href="../fonts.css"/>
<style>
:root { --forest:#1b3221; --sage:#5a8040; --sage-light:#a8c994; --ink:#0d1410; --muted:#5f6461; --soft:#6f746d; --rule:#d6d0c0; --paper:#f6f0e3; --card:#fffdf8; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 Jost, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
main { max-width: 760px; margin: 0 auto; background: var(--card); padding: 40px 48px 48px; box-shadow: 12px 12px 0 var(--sage-light); margin-top: 32px; margin-bottom: 48px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--sage); }
.head svg { width: 170px; height: auto; display: block; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
.head .meta { font: 400 11px/1.7 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); text-align: right; }
h1 { font: 600 34px/1.1 Jost; letter-spacing: -.02em; color: var(--forest); margin: 28px 0 8px; }
.parties { color: var(--muted); margin: 0 0 8px; }
.parties strong { color: var(--ink); font-weight: 600; }
h2 { display: grid; grid-template-columns: 2em 1fr; font: 600 19px/1.3 Jost; color: var(--forest); margin: 28px 0 8px; }
h2 .n { font: 400 13px "JetBrains Mono", monospace; color: var(--sage); padding-top: 4px; }
.sec { padding-left: 2em; }
p { margin: 0 0 10px; }
ul { margin: 0 0 10px; padding-left: 1.2em; }
li { margin-bottom: 5px; }
li::marker { color: var(--sage); }
strong { font-weight: 600; }
.lbl { font: 400 11px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin: 14px 0 4px; }

.opts { margin: 6px 0 12px; border-top: 1px solid rgba(13,20,16,.1); }
.opt { display: grid; grid-template-columns: 30px 1fr auto; gap: 0 10px; align-items: start; padding: 12px 4px; border-bottom: 1px solid rgba(13,20,16,.1); cursor: pointer; }
.opt input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 3px 0 0; border: 1.5px solid var(--forest); border-radius: 4px; display: grid; place-items: center; cursor: pointer; }
.opt input:checked { background: var(--forest); }
.opt input:checked::after { content: ""; width: 10px; height: 6px; border: 2px solid var(--paper); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.opt input:focus-visible { outline: 3px solid rgba(90,128,64,.45); outline-offset: 2px; }
.opt b { font-weight: 600; }
.opt small { display: block; color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 2px; }
.opt .amt { font: 400 15px "JetBrains Mono", monospace; color: var(--forest); white-space: nowrap; padding-top: 1px; }
.opt.on { background: rgba(168,201,148,.18); }
.opt.off { display: none; }
.signed-view .opt { cursor: default; }

.sigwrap { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--sage); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.side .role { font: 400 11px "JetBrains Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--sage); }
.side .party { font: 600 17px Jost; color: var(--forest); margin: 4px 0 12px; }
.side .party small { display: block; font: 400 14px Jost; color: var(--muted); }
.typed { font: 400 15px Jost; border-bottom: 1px solid var(--ink); padding: 6px 0 4px; min-height: 34px; }
.cap { font: 400 10.5px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin: 4px 0 14px; }
label.f { display: block; }
label.f span { display: block; font: 400 11px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin-bottom: 4px; }
input.t { width: 100%; font: 400 17px Jost; color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 11px 12px; margin-bottom: 14px; }
input.t:focus { outline: 3px solid rgba(90,128,64,.35); border-color: var(--sage); }
.pad { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; position: relative; border: 1.5px dashed var(--sage); border-radius: 10px; background: #fff; height: 170px; touch-action: none; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.pad .hint { position: absolute; left: 14px; right: 14px; bottom: 34px; border-bottom: 1px solid var(--rule); pointer-events: none; }
.pad .x { position: absolute; left: 14px; bottom: 38px; color: var(--soft); font: 400 18px Jost; pointer-events: none; }
.pad .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--soft); font-size: 15px; pointer-events: none; }
.padrow { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 16px; }
.linkbtn { background: none; border: 0; color: var(--sage); font: 500 14px Jost; padding: 10px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.agree { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; font-size: 15px; color: var(--muted); margin: 4px 0 18px; cursor: pointer; }
.agree input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--forest); }
.btn { display: block; width: 100%; background: var(--forest); color: var(--paper); border: 0; border-radius: 10px; font: 600 18px Jost; padding: 16px; cursor: pointer; }
.btn.wait { opacity: .5; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.ghost { background: transparent; color: var(--forest); border: 1.5px solid var(--forest); }
.err { color: #9b2c1f; font-size: 15px; min-height: 1.4em; margin: 10px 0 0; }
.sigimg { display: block; width: 100%; max-width: 320px; height: auto; border-bottom: 1px solid var(--ink); }
.stamp { display: inline-block; margin: 26px 0 6px; font: 400 11px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--forest); background: rgba(168,201,148,.35); padding: 6px 10px; border-radius: 4px; }
.audit { font-size: 13px; color: var(--soft); margin-top: 18px; }
.center { text-align: center; padding: 60px 0; color: var(--muted); }
.actions { display: flex; gap: 12px; margin-top: 22px; }
.actions .btn { flex: 1; }
.pay { margin: 4px 0 30px; padding: 20px 20px 18px; background: #f2f6ec; border: 1px solid var(--sage-light); border-radius: 12px; }
.pay h3 { font: 600 22px/1.2 Jost; color: var(--forest); margin: 2px 0 12px; }
.pay .lbl { margin-top: 0; }
.pay .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(13,20,16,.1); }
.pay .row span:last-child { font-family: "JetBrains Mono", monospace; color: var(--forest); white-space: nowrap; }
.pay .row.total { border-bottom: 0; font-weight: 600; }
.pay .then { color: var(--muted); font-size: 15px; margin: 6px 0 16px; }
.pay .how { color: var(--muted); font-size: 14px; margin: 12px 0 0; text-align: center; }
.pay.done h3 { margin-bottom: 4px; }
.pay.done p { color: var(--muted); margin: 0; }
.test { background: #fdf1c7; color: #6a5300; font: 400 12px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 8px; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  main { margin: 0; padding: 22px 16px 32px; box-shadow: none; }
  .head svg { width: 140px; }
  .head .meta { font-size: 9.5px; }
  h1 { font-size: 28px; margin-top: 22px; }
  h2 { grid-template-columns: 1.6em 1fr; font-size: 18px; }
  .sec { padding-left: 0; }
  .sides { grid-template-columns: 1fr; gap: 30px; }
  .side.you { order: -1; }
}
@media print {
  @page { size: letter; margin: .6in .7in; }
  body { background: #fff; font-size: 10pt; }
  main { box-shadow: none; margin: 0; padding: 0; max-width: none; }
  .actions, .no-print, .test { display: none !important; }
  h2 { break-after: avoid; }
  .sigwrap { break-inside: avoid; }
  .opt { padding: 6px 4px; }
}
</style>
</head>
<body>
<div id="test" class="test" hidden>Test copy, not a real agreement</div>
<main>
  <header class="head"><svg role="img" aria-label="Stockwell Media Co" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 110" width="430" height="110">
<g transform="translate(8,12) scale(0.86)"><rect x="6" y="6" width="88" height="88" rx="22" fill="#1b3221"></rect><ellipse cx="50" cy="76" rx="25" ry="6" fill="none" stroke="#f4efe4" stroke-width="4"></ellipse><ellipse cx="50" cy="76" rx="8" ry="2.5" fill="#a8c994"></ellipse><rect x="47" y="28" width="6" height="46" rx="2" fill="#f4efe4"></rect><line x1="50" y1="30" x2="28" y2="76" stroke="#a8c994" stroke-width="2.4" stroke-linecap="round"></line><line x1="50" y1="30" x2="39" y2="76" stroke="#a8c994" stroke-width="2.4" stroke-linecap="round"></line><line x1="50" y1="30" x2="61" y2="76" stroke="#a8c994" stroke-width="2.4" stroke-linecap="round"></line><line x1="50" y1="30" x2="72" y2="76" stroke="#a8c994" stroke-width="2.4" stroke-linecap="round"></line></g>
<text x="110" y="52" font-family="Jost, sans-serif" font-weight="600" font-size="32" letter-spacing="4.6" fill="#1b3221">STOCKWELL</text>
<text x="112" y="78" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" letter-spacing="6.4" fill="#5a8040">MEDIA CO</text>
</svg><div class="meta">Southwest Missouri<br>stockwellmedia.com</div></header>
  <div id="app"><p class="center">Loading your agreement…</p></div>
</main>

<script>
(() => {
  const API = "https://souugetwznrxjtlasdtb.supabase.co/rest/v1/rpc/";
  const KEY = "sb_publishable_fkxD7LUIQ7aWPRKEGC-yGw_W5XoZVaA";
  const token = new URLSearchParams(location.search).get("k") || "";
  const app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => "$" + Number(n).toLocaleString("en-US");
  const fmtDate = d => new Date(d).toLocaleDateString("en-US", { timeZone: "America/Chicago", month: "long", day: "numeric", year: "numeric" });
  const fmtTime = d => new Date(d).toLocaleString("en-US", { timeZone: "America/Chicago", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) + " CT";

  async function rpc(fn, body) {
    const r = await fetch(API + fn, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }

  function optRows(list, name, chosen, signed) {
    return '<div class="opts">' + list.map(o => {
      const on = chosen === o.id;
      const price = name === "build" ? money(o.price) : esc(o.price);
      return `<label class="opt${on ? " on" : ""}${signed && !on ? " off" : ""}"><input type="radio" name="${name}" value="${esc(o.id)}"${on ? " checked" : ""}${signed ? " disabled" : ""}><span><b>${esc(o.name)}</b><small>${esc(o.desc)}</small></span><span class="amt">${price}</span></label>`;
    }).join("") + "</div>";
  }

  function agreementHTML(t, choices, signed) {
    const m = money(t.monthly);
    return `
<h1>Website Agreement</h1>
<p class="parties">Between <strong>Stocks Garage and Media LLC</strong>, a Missouri limited liability company doing business as Stockwell Media Co ("Stockwell", "we"), and <strong>${esc(t.client)}</strong>, ${esc(t.address)} ("you"). This agreement starts on the date you sign it.</p>

<h2><span class="n">1</span>What we're building</h2>
<div class="sec"><p>A website for ${esc(t.client)} that works on phones and computers: your menu, hours, location and directions, photos, and a button to call in an order. Before it goes live you get a private preview link, and changes before launch are included. We aim to launch within ${t.launch_days} days of signing, once you've approved the preview.</p></div>

<h2><span class="n">2</span>Build price</h2>
<div class="sec"><p>${signed ? "Chosen option. The build fee is due at signing." : "Pick one. The build fee is due when you sign."}</p>${optRows(t.build, "build", choices.build, signed)}</div>

<h2><span class="n">3</span>Monthly plan: ${m} a month</h2>
<div class="sec">
<p>Starts the month the site launches. It covers:</p>
<ul>
<li>Hosting, security certificate, and keeping the site up and working</li>
<li>Your web address (domain), registered in your name. We pay the yearly domain fee for you</li>
<li>Menu, price, hours and photo changes. Text or email us and we make them within 2 business days</li>
<li>Keeping your Google Business listing matched to the site</li>
</ul>
<p>Not included: a redesign, new pages or features, ads, or social media. We'll quote those separately if you ever want them.</p>
<p class="lbl">How you'd like to pay</p>
${optRows(t.pay, "pay", choices.pay, signed)}
<p>We take card, ACH or check. If a payment is more than 15 days late, we'll let you know, and if it's still unpaid 10 days after that we may take the site offline until it's caught up.</p>
</div>

<h2><span class="n">4</span>How long, and how to cancel</h2>
<div class="sec"><ul>
<li>The monthly plan has a <strong>${t.minimum_months}-month minimum</strong>, counted from launch.</li>
<li>After ${t.minimum_months} months it goes <strong>month to month</strong>. Either of us can cancel with ${t.notice_days} days' notice by text or email.</li>
<li>If you cancel before the ${t.minimum_months} months are up, the remaining months of the minimum are still due.</li>
<li>Prepaid months are not refunded.</li>
</ul></div>

<h2><span class="n">5</span>What's yours</h2>
<div class="sec"><ul>
<li>Your domain, your Google listing, your name, logo, menu and photos are yours, now and after you cancel.</li>
<li>If you cancel, we transfer the domain to you. The site itself comes down at the end of your notice period, unless you buy the site files for a one-time <strong>${money(t.buyout)}</strong> and host them anywhere you like.</li>
<li>We may show the site in our portfolio.</li>
</ul></div>

<h2><span class="n">6</span>Your part</h2>
<div class="sec"><p>Tell us when your menu, prices or hours change, and make sure anything you give us (photos, logos, text) is yours to use. You're responsible for your menu prices and the claims on your site being accurate.</p></div>

<h2><span class="n">7</span>The fine print</h2>
<div class="sec"><p>We'll do the work carefully and fix anything that breaks on our end. Every website can occasionally go down for reasons outside our control, like a server or internet outage. If that happens, we'll stay on it until it's back up and keep you updated, but we're not responsible for outages outside our control. We're also not responsible for lost sales or business. Our total responsibility under this agreement is capped at what you paid us in the 6 months before the problem. Missouri law applies, and any dispute goes to court in Greene County, Missouri. This is our whole agreement; any change has to be agreed in writing, and text or email counts. Signing electronically counts the same as signing on paper.</p></div>`;
  }

  function stockwellSide(issued) {
    return `<div class="side"><div class="role">Stockwell</div><div class="party">Stocks Garage and Media LLC<small>d/b/a Stockwell Media Co</small></div>
<div class="typed">Stock Curtis, Founder</div><div class="cap">Signed for Stockwell</div>
<div class="typed">${fmtDate(issued)}</div><div class="cap">Date issued</div></div>`;
  }

  function renderInvalid() {
    app.innerHTML = `<div class="center"><h1>This link isn't active</h1><p>Text Stock at 816.797.2739 and he'll send you a fresh one.</p></div>`;
  }

  const FN = "https://souugetwznrxjtlasdtb.supabase.co/functions/v1/stockwell-pay";
  // 1st of the month after signed_at + launch_days (stockwell-pay bills the monthly plan from this date)
  function firstBill(signedAt, days) {
    const d = new Date(new Date(signedAt).getTime() + (days || 14) * 864e5);
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1, 15));
  }
  const justPaid = new URLSearchParams(location.search).get("paid") === "1";
  const justUpdated = new URLSearchParams(location.search).get("updated") === "1";
  let polls = 0;

  function payBox(d) {
    const s = d.signed, t = d.terms;
    const build = t.build.find(b => b.id === s.choices.build), pay = t.pay.find(p => p.id === s.choices.pay);
    if (!build || !pay) return "";
    if (d.pay_status === "past_due") {
      if (justUpdated) return `<div class="pay done no-print"><h3>Thanks, we got your new payment method</h3><p>We're retrying the payment now. This page will update once it goes through.</p></div>`;
      return `<div class="pay no-print" id="paybox"><div class="lbl">Action needed</div><h3>Your monthly payment didn't go through</h3>
<p class="then">Your card or bank declined the ${money(t.monthly)} website plan payment. Update your payment method and we'll retry it right away.</p>
<button class="btn" id="paynow" data-action="update_payment">Update payment method</button><p class="err" id="payerr" role="alert"></p>
<p class="how">Card, bank, or Apple Pay on a secure page. Questions? Text Stock at 816.797.2739.</p></div>`;
    }
    if (d.pay_status === "paid") return `<div class="pay done no-print"><h3>Paid. Thank you!</h3><p>You're all set. We'll send your preview link soon.</p></div>`;
    if (d.pay_status === "processing") return `<div class="pay done no-print"><h3>Payment received</h3><p>Bank payments take about 4 business days to clear. Nothing else to do.</p></div>`;
    if (justPaid && polls < 6) return `<div class="pay done no-print"><h3>Payment received</h3><p>Confirming with the bank…</p></div>`;
    const num = v => Number(String(v).replace(/[^0-9.]/g, ""));
    const monthly = pay.id === "monthly";
    const total = num(build.price) + (monthly ? 0 : num(pay.price));
    const rows = `<div class="row"><span>${esc(build.name)}</span><span>${money(num(build.price))}</span></div>`
      + (monthly ? "" : `<div class="row"><span>${esc(pay.name)}</span><span>${money(num(pay.price))}</span></div>`)
      + `<div class="row total"><span>Due today</span><span>${money(total)}</span></div>`;
    const then = monthly
      ? `<p class="then">Then ${money(t.monthly)} a month, paid automatically on the 1st, starting ${esc(fmtDate(firstBill(s.signed_at, t.launch_days)))}.</p>`
      : `<p class="then">Covers your build and ${parseInt(pay.id, 10) || ""} months of the monthly plan. After that it's $${t.monthly} a month on the same card or bank account, unless you cancel or prepay again.</p>`;
    return `<div class="pay no-print" id="paybox"><div class="lbl">Last step</div><h3>Pay to get started</h3>${rows}${then}
<button class="btn" id="paynow">Pay now</button><p class="err" id="payerr" role="alert"></p>
<p class="how">Pay by bank, card, or Apple Pay on a secure checkout page. Paying by bank is preferred.</p></div>`;
  }

  function wirePay() {
    const b = document.getElementById("paynow");
    if (!b) return;
    b.onclick = async () => {
      const action = b.dataset.action, label = b.textContent;
      b.disabled = true; b.textContent = "Opening secure page…"; document.getElementById("payerr").textContent = "";
      try {
        const r = await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY }, body: JSON.stringify(action ? { token, action } : { token }) });
        const d = await r.json();
        if (d.url) { location.href = d.url; return; }
        if (d.status === "paid" || d.status === "processing") return load();
        if (d.status === "canceled") { b.disabled = false; b.textContent = label; document.getElementById("payerr").textContent = "Your plan needs to be restarted by us. Text Stock at 816.797.2739 and he'll sort it out."; return; }
        throw new Error(d.status);
      } catch (e) {
        b.disabled = false; b.textContent = label;
        document.getElementById("payerr").textContent = "Checkout didn't open. Check your connection and try again, or text Stock at 816.797.2739.";
      }
    };
  }

  function renderSigned(d) {
    const s = d.signed, t = d.terms;
    document.title = "Signed agreement · Stockwell Media Co";
    app.innerHTML = `<div class="signed-view">
${payBox(d)}<span class="stamp">Signed ${esc(fmtTime(s.signed_at))}</span>
${agreementHTML(t, s.choices, true)}
<div class="sigwrap"><div class="sides">
${stockwellSide(d.issued)}
<div class="side"><div class="role">You</div><div class="party">${esc(s.business || t.client)}</div>
<img class="sigimg" alt="Signature of ${esc(s.name)}" src="${esc(s.signature)}">
<div class="cap">Signature</div>
<div class="typed">${esc(s.name)}${s.title ? ", " + esc(s.title) : ""}</div><div class="cap">Name and title</div>
<div class="typed">${esc(fmtDate(s.signed_at))}</div><div class="cap">Date</div></div>
</div>
<p class="audit">Signed electronically at stockwellmedia.com on ${esc(fmtTime(s.signed_at))}. Agreement ID ${esc(token)}.</p>
</div>
<div class="actions"><button class="btn" id="print">Save a copy (PDF)</button></div>
</div>`;
    document.getElementById("print").onclick = () => window.print();
    wirePay();
    // back from checkout before the webhook landed: re-check a few times
    if (((justPaid && !d.pay_status) || (justUpdated && d.pay_status === "past_due")) && polls < 6) { polls++; setTimeout(load, 2500); }
  }

  function renderOpen(d) {
    const t = d.terms;
    app.innerHTML = `<div id="doc">${agreementHTML(t, {}, false)}</div>
<div class="sigwrap"><div class="sides">
${stockwellSide(d.issued)}
<div class="side you"><div class="role">You</div><div class="party">Sign here</div>
<label class="f"><span>Business legal name</span><input class="t" id="biz" value="${esc(t.client)}" autocomplete="organization"></label>
<label class="f"><span>Your full name</span><input class="t" id="name" autocomplete="name" placeholder="First and last name"></label>
<label class="f"><span>Your title</span><input class="t" id="title" placeholder="Owner"></label>
<div class="lbl" style="margin-top:2px">Sign with your finger</div>
<div class="pad" id="pad"><canvas id="cv"></canvas><span class="hint"></span><span class="x">×</span><span class="ph" id="ph">Sign here</span></div>
<div class="padrow"><span class="cap" style="margin:0">Signature</span><button type="button" class="linkbtn" id="clear">Clear</button></div>
<label class="agree"><input type="checkbox" id="ok"><span>I've read this agreement, I agree to it, and I agree to sign it electronically.</span></label>
<button class="btn wait" id="sign">Sign agreement</button>
<p class="err" id="err" role="alert"></p>
</div></div></div>`;

    const $ = id => document.getElementById(id);
    const cv = $("cv"), ctx = cv.getContext("2d");
    let ink = 0, drawing = false, last = null;
    function size() {
      const r = cv.getBoundingClientRect(), dpr = Math.max(1, window.devicePixelRatio || 1);
      const prev = ink ? cv.toDataURL() : null;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0d1410";
      if (prev) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = prev; }
    }
    size();
    window.addEventListener("resize", size);
    const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pt(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = "#0d1410"; ctx.fill(); $("ph").hidden = true; });
    cv.addEventListener("pointermove", e => {
      if (!drawing) return; e.preventDefault();
      const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; check();
    });
    const end = () => { drawing = false; };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    $("clear").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); ink = 0; $("ph").hidden = false; check(); };

    const chosen = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value;
    document.querySelectorAll(".opt input").forEach(i => i.addEventListener("change", () => {
      document.querySelectorAll(`input[name="${i.name}"]`).forEach(x => x.closest(".opt").classList.toggle("on", x.checked)); check();
    }));
    function missing() {
      if (!chosen("build")) return "Pick a build option in section 2.";
      if (!chosen("pay")) return "Pick how you'd like to pay in section 3.";
      if ($("name").value.trim().length < 2) return "Type your full name.";
      if (ink < 60) return "Sign in the box with your finger.";
      if (!$("ok").checked) return "Tick the box to agree.";
      return "";
    }
    function check() { $("sign").classList.toggle("wait", !!missing()); if (!missing()) $("err").textContent = ""; }
    ["name", "title", "biz"].forEach(id => $(id).addEventListener("input", check));
    $("ok").addEventListener("change", check);

    $("sign").onclick = async () => {
      const m = missing(); if (m) { $("err").textContent = m; return; }
      $("sign").disabled = true; $("sign").textContent = "Signing…"; $("err").textContent = "";
      const choices = { build: chosen("build"), pay: chosen("pay") };
      // snapshot of exactly what was on screen, with the picks marked
      const snap = document.getElementById("doc").cloneNode(true);
      snap.querySelectorAll(".opt").forEach(o => { if (!o.querySelector("input").checked) o.remove(); });
      try {
        const r = await rpc("stockwell_agreement_sign", {
          p_token: token, p_name: $("name").value, p_title: $("title").value, p_business: $("biz").value,
          p_choices: choices, p_signature: cv.toDataURL("image/png"), p_html: snap.innerHTML, p_ua: navigator.userAgent
        });
        if (r.status === "signed" || r.status === "already_signed") { window.scrollTo(0, 0); return load(); }
        throw new Error(r.error || r.status);
      } catch (e) {
        $("sign").disabled = false; $("sign").textContent = "Sign agreement";
        $("err").textContent = "That didn't go through. Check your connection and tap Sign again, or text Stock at 816.797.2739.";
      }
    };
  }

  async function load() {
    if (!token) return renderInvalid();
    document.getElementById("test").hidden = !token.startsWith("test-");
    try {
      const d = await rpc("stockwell_agreement_get", { p_token: token });
      if (d.status === "signed") renderSigned(d);
      else if (d.status === "open") renderOpen(d);
      else renderInvalid();
    } catch (e) {
      app.innerHTML = `<div class="center"><p>Couldn't load the agreement. Check your connection and refresh.</p></div>`;
    }
  }
  load();
})();
</script>
</body>
</html>
